<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Printer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="printer-container">
            <header class="header">
                <div class="header-brand">
                    <div class="brand-icon">
                        <i class="fa-solid fa-cube glow-pulse"></i>
                    </div>
                    <div class="brand-info">
                        <h1 id="uiTitle">3D PRINTER</h1>
                    </div>
                </div>

                <div class="header-status">
                    <div id="statusBadge" class="status-badge status-idle">
                        <span class="badge-dot"></span>
                        <span id="statusText">READY</span>
                    </div>
                    <button id="closeBtn" class="close-btn" title="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </header>

            <main class="main-content">
                <aside class="side-panel">
                    <div class="card storage-card">
                        <div class="card-title">
                            <i class="fa-solid fa-boxes-stacked"></i>
                            <span id="txtStorage">STORAGE</span>
                        </div>

                        <div class="material-list">
                            <div class="mat-item">
                                <div class="mat-header">
                                    <div class="mat-label">
                                        <i class="fa-solid fa-bottle-droplet cyan-text"></i>
                                        <span id="txtPlastic">Plastic Filament</span>
                                    </div>
                                    <span id="plasticVal" class="mat-count">0 / 200</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div id="plasticBar" class="progress-fill cyan-fill" style="width: 0%"></div>
                                </div>
                                <button class="refill-btn" id="btnRefillPlastic" onclick="openRefillModal('plastic_filament', getLocText('plastic_label'))">
                                    <i class="fa-solid fa-plus"></i> <span class="txtAdd">Add</span>
                                </button>
                            </div>

                            <div class="mat-item">
                                <div class="mat-header">
                                    <div class="mat-label">
                                        <i class="fa-solid fa-shield-halved purple-text"></i>
                                        <span id="txtMetal">Metal Filament</span>
                                    </div>
                                    <span id="metalVal" class="mat-count">0 / 200</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div id="metalBar" class="progress-fill purple-fill" style="width: 0%"></div>
                                </div>
                                <button class="refill-btn" id="btnRefillMetal" onclick="openRefillModal('metal_filament', getLocText('metal_label'))">
                                    <i class="fa-solid fa-plus"></i> <span class="txtAdd">Add</span>
                                </button>
                            </div>

                            <div class="mat-item">
                                <div class="mat-header">
                                    <div class="mat-label">
                                        <i class="fa-solid fa-battery-three-quarters amber-text"></i>
                                        <span id="txtBattery">Battery</span>
                                    </div>
                                    <span id="chipVal" class="mat-count">0 / 20</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div id="chipBar" class="progress-fill amber-fill" style="width: 0%"></div>
                                </div>
                                <button class="refill-btn" id="btnRefillBattery" onclick="openRefillModal('printer_battery', getLocText('battery_label'))">
                                    <i class="fa-solid fa-battery-full"></i> <span class="txtAddBattery">Insert Battery</span>
                                </button>
                            </div>

                            <div class="mat-item durability-item" style="border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 10px; margin-top: 8px;">
                                <div class="mat-header">
                                    <div class="mat-label">
                                        <i id="durabilityIcon" class="fa-solid fa-screwdriver-wrench green-text"></i>
                                        <span id="txtDurability">Condition</span>
                                    </div>
                                    <span id="durabilityVal" class="mat-count">100%</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div id="durabilityBar" class="progress-fill green-fill" style="width: 100%"></div>
                                </div>
                                <button class="refill-btn repair-btn" style="background: rgba(39, 174, 96, 0.2); border-color: rgba(39, 174, 96, 0.5); color: #2ecc71;" onclick="repairPrinter()">
                                    <i class="fa-solid fa-wrench"></i> <span id="txtRepair">Repair</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="card active-job-card">
                        <div class="card-title">
                            <i class="fa-solid fa-print"></i>
                            <span id="txtActivePrint">PRINTING</span>
                        </div>

                        <div id="noJobView" class="no-job-state">
                            <i class="fa-solid fa-hourglass-start float-anim"></i>
                            <p id="txtIdle">Printer Idle</p>
                        </div>

                        <div id="activeJobView" class="active-job-state hidden">
                            <div class="job-item-header">
                                <span id="jobItemName" class="job-name"></span>
                                <span id="jobTimeLeft" class="job-timer">00:00</span>
                            </div>

                            <div class="print-visualizer">
                                <div id="laserBeam" class="laser-beam"></div>
                                <i id="jobItemIcon" class="fa-solid fa-gun job-icon-large"></i>
                            </div>

                            <div class="progress-bar-bg main-progress">
                                <div id="mainProgressBar" class="progress-fill active-glow" style="width: 0%"></div>
                            </div>

                            <div class="job-actions">
                                <button id="pickupBtn" class="btn btn-success hidden" onclick="pickupPrint()">
                                    <i class="fa-solid fa-hand-holding-dollar"></i> <span id="txtPickup">Collect</span>
                                </button>
                                <button id="cancelBtn" class="btn btn-danger hidden" onclick="cancelPrint()">
                                    <i class="fa-solid fa-trash-can"></i> <span id="txtCancel">Cancel</span>
                                </button>
                            </div>
                        </div>

                        <div class="pack-section" style="display: flex; gap: 8px;">
                            <button class="btn btn-secondary w-full" style="background: rgba(41, 128, 185, 0.2); border-color: rgba(41, 128, 185, 0.5); color: #3498db;" onclick="extractMaterials()">
                                <i class="fa-solid fa-hand-holding"></i> <span id="txtExtract">Extract</span>
                            </button>
                            <button class="btn btn-secondary w-full" onclick="packPrinter()">
                                <i class="fa-solid fa-box-archive"></i> <span id="txtPack">Pack</span>
                            </button>
                        </div>
                    </div>
                </aside>

                <section class="catalog-panel">
                    <div class="category-tabs">
                        <button class="tab-btn active" onclick="filterCategory('all', this)">
                            <i class="fa-solid fa-border-all"></i> <span id="tabAll">All</span>
                        </button>
                        <button class="tab-btn" onclick="filterCategory('tools', this)">
                            <i class="fa-solid fa-wrench"></i> <span id="tabTools">Tools</span>
                        </button>
                        <button class="tab-btn" onclick="filterCategory('attachments', this)">
                            <i class="fa-solid fa-sliders"></i> <span id="tabAttachments">Attachments</span>
                        </button>
                        <button class="tab-btn" onclick="filterCategory('weapons', this)">
                            <i class="fa-solid fa-gun"></i> <span id="tabWeapons">Weapons</span>
                        </button>
                        <button class="tab-btn darkweb-tab" onclick="switchView('darkweb', this)">
                            <i class="fa-solid fa-laptop-code glow-pulse"></i> <span id="tabDarkweb">CAD Store</span>
                        </button>
                    </div>

                    <div id="recipesGrid" class="recipes-grid"></div>

                    <div id="darkwebPanel" class="darkweb-grid hidden"></div>
                </section>
            </main>
        </div>

        <div id="refillModal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">Add Material</h3>
                    <button onclick="closeRefillModal()" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <label for="refillAmount" id="lblAmount">Amount:</label>
                    <input type="number" id="refillAmount" min="1" max="200" value="10">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeRefillModal()" id="btnCancelModal">Cancel</button>
                    <button class="btn btn-primary" onclick="confirmRefill()" id="btnConfirmModal">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
